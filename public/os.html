<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrainOS</title>
<style>
html, body { height: 100%; margin: 0; overflow: hidden; font-size: var(--font-size, 14px); font-family: var(--font-ui, system-ui, sans-serif); }
svg { vertical-align: -.125em; }
#boot-screen { position: fixed; inset: 0; z-index: 99999; background: #111; color: #eee; }

/* デスクトップ。固定のパネルがあるときは、その分だけ縮む（--inset-*） */
#desktop { position: fixed; inset: var(--inset-top, 0px) var(--inset-right, 0px) var(--inset-bottom, 0px) var(--inset-left, 0px); background: var(--desk-bg, #245); overflow: hidden; }
#desktop.drag iframe { pointer-events: none; }
#wp { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
#icons { position: absolute; inset: 0; z-index: 0; padding: 8px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, var(--icon-cell, 84px)); grid-auto-columns: var(--icon-cell, 84px); gap: 4px; align-content: start; justify-content: start; pointer-events: none; }
.ico { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; color: var(--icon-fg, #fff); font: inherit; font-size: 12px; padding: 6px; border-radius: 6px; cursor: pointer; overflow: hidden; word-break: break-all; }
.ico svg { font-size: var(--icon-size, 34px); }
.ico:hover, .ico:focus { background: #fff3; outline: none; }

/* ウィンドウ（色・枠・角丸・影・タイトルバーはウィンドウテーマの変数） */
.win { position: absolute; display: flex; flex-direction: column; min-width: 200px; min-height: 120px; resize: both; overflow: hidden; background: var(--win-bg, Canvas); color: var(--win-fg, CanvasText); border: var(--win-border, 1px solid #888); border-radius: var(--win-radius, 6px); box-shadow: var(--win-shadow, 0 4px 16px #0006); }
.win.fixed { resize: none; }
.win.min { display: none; }
.win.front { outline: var(--win-focus, none); }
.win.closing { pointer-events: none; }
.win.snap { transition: left var(--snap-ms, 0s) ease, top var(--snap-ms, 0s) ease, width var(--snap-ms, 0s) ease, height var(--snap-ms, 0s) ease; }
.win .t { display: flex; justify-content: space-between; align-items: center; padding: var(--title-pad, 2px 4px 2px 8px); background: var(--title-bg, #335); color: var(--title-fg, #fff); cursor: move; user-select: none; touch-action: none; }
.win.fixed .t { cursor: default; }
.win .btns { display: flex; gap: var(--btn-gap, 2px); }
.win .t button { display: inline-flex; background: none; border: 0; color: inherit; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.win .t button:hover { background: #fff3; }
.win .c { flex: 1; min-height: 0; }

/* パネル（ドックにもタスクバーにもなる）と、ランチャーのメニュー */
#panel { position: fixed; z-index: 99998; display: flex; align-items: center; gap: var(--panel-gap, 8px); padding: 6px; box-sizing: border-box; background: var(--panel-bg, var(--bar-bg, #222)); color: var(--panel-fg, var(--bar-fg, #eee)); border-radius: var(--panel-radius, 16px); transition: transform .2s; }
#panel[hidden] { display: none; }
#panel.p-bottom, #panel.p-top { left: 0; right: 0; margin: 0 auto; width: max-content; max-width: 96vw; }
#panel.p-left, #panel.p-right { top: 0; bottom: 0; margin: auto 0; height: max-content; max-height: 96vh; flex-direction: column; }
#panel.p-bottom { bottom: var(--panel-margin, 8px); } #panel.p-top { top: var(--panel-margin, 8px); }
#panel.p-left { left: var(--panel-margin, 8px); } #panel.p-right { right: var(--panel-margin, 8px); }
#panel.fill { border-radius: var(--panel-radius, 0); --panel-margin: 0px; }
#panel.fill.p-bottom, #panel.fill.p-top { left: 0; right: 0; width: auto; max-width: none; height: var(--panel-size, 36px); margin: 0; }
#panel.fill.p-left, #panel.fill.p-right { top: 0; bottom: 0; height: auto; max-height: none; width: var(--panel-size, 36px); margin: 0; }
#panel.auto.p-bottom { transform: translateY(calc(100% + var(--panel-margin, 8px) - 6px)); }
#panel.auto.p-top { transform: translateY(calc(-100% - var(--panel-margin, 8px) + 6px)); }
#panel.auto.p-left { transform: translateX(calc(-100% - var(--panel-margin, 8px) + 6px)); }
#panel.auto.p-right { transform: translateX(calc(100% + var(--panel-margin, 8px) - 6px)); }
#panel.auto:hover { transform: none; }
#panel .sp { flex: 1; }
#panel .pt { padding: 0 6px; font-size: 12px; opacity: .9; white-space: nowrap; }
#panel .wl { display: flex; gap: 4px; flex-direction: inherit; min-width: 0; overflow: hidden; }
.pk, .pw { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: var(--panel-icon, 28px); min-height: var(--panel-icon, 28px); background: none; border: 0; border-radius: 8px; color: inherit; font: inherit; font-size: 11px; cursor: pointer; padding: 0 6px; }
.pk svg { font-size: calc(var(--panel-icon, 28px) * .6); }
.pk:hover, .pw:hover { background: var(--btn-bg, #fff3); }
.pk:disabled { opacity: .4; cursor: default; }
.pk.lbl { flex-direction: row; gap: 6px; font-size: inherit; }
.pk.run::after { content: ''; position: absolute; bottom: 1px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.pw { flex-direction: row; gap: 6px; font-size: inherit; max-width: 160px; }
.pw span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pw.on { background: var(--btn-bg, #fff3); }
.pw.dim { opacity: .55; }
#menu { position: fixed; z-index: 99999; display: flex; flex-direction: column; gap: 2px; background: var(--panel-bg, var(--bar-bg, #222)); color: var(--panel-fg, var(--bar-fg, #eee)); padding: 4px; border-radius: var(--panel-radius, 8px); }
#menu[hidden] { display: none; }
#menu button { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: inherit; font: inherit; border-radius: 6px; padding: 6px 10px; cursor: pointer; text-align: left; }
#menu button:hover { background: var(--btn-bg, #fff3); }
</style>
</head>
<body>
<div id="boot-screen"></div>
<div id="desktop"></div>
<script src="sys/icons.js?v=0.3.2"></script>
<script src="sys/boot.js?v=0.3.2"></script>
<script src="sys/backend_local.js?v=0.3.2"></script>
<script src="sys/backend_drive.js?v=0.3.2"></script>
<script src="sys/skeleton.js?v=0.3.2"></script>
<script src="sys/app_loader.js?v=0.3.2"></script>
<script src="sys/desktop.js?v=0.3.2"></script>
<script src="firebase-config.js?v=0.3.2"></script>
<script src="sys/kernel.js?v=0.3.2"></script>
<script>TrainOSKernel.boot();</script>
</body>
</html>
