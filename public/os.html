<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrainOS</title>
<style>
html, body { height: 100%; margin: 0; overflow: hidden; font-size: var(--font-size, 14px); font-family: var(--font-ui, system-ui, sans-serif); }
#boot-screen { position: fixed; inset: 0; z-index: 99999; background: #111; color: #eee; }
#desktop { position: fixed; inset: 0 0 32px 0; background: var(--desk-bg, #245); }
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 32px; display: flex; gap: 8px; align-items: center; padding: 0 4px; background: var(--bar-bg, #222); color: var(--bar-fg, #eee); }
#menu { position: absolute; left: 4px; bottom: 34px; display: flex; flex-direction: column; gap: 2px; background: var(--bar-bg, #222); padding: 4px; border-radius: 6px; }
svg { vertical-align: -.125em; }
#bar button { display: inline-flex; align-items: center; gap: 6px; background: var(--btn-bg, #444); color: var(--bar-fg, #eee); border: 0; border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
#bar button:disabled { opacity: .4; cursor: default; }
#icons { position: absolute; inset: 0; z-index: 0; padding: 8px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, var(--icon-cell, 84px)); grid-auto-columns: var(--icon-cell, 84px); gap: 4px; align-content: start; justify-content: start; pointer-events: none; }
.ico { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; color: var(--icon-fg, #fff); font: inherit; font-size: 12px; padding: 6px; border-radius: 6px; cursor: pointer; overflow: hidden; word-break: break-all; }
.ico svg { font-size: var(--icon-size, 34px); }
.ico:hover, .ico:focus { background: #fff3; outline: none; }
.win .t button { display: inline-flex; background: none; border: 0; color: var(--title-fg, #fff); cursor: pointer; padding: 2px 6px; }
#menu[hidden] { display: none; }
.win { position: absolute; display: flex; flex-direction: column; min-width: 200px; min-height: 120px; resize: both; overflow: hidden; background: var(--win-bg, Canvas); color: var(--win-fg, CanvasText); border: var(--win-border, 1px solid #888); border-radius: var(--win-radius, 6px); box-shadow: var(--win-shadow, 0 4px 16px #0006); animation: win-in var(--anim, 0s) ease-out; }
.win .t { display: flex; justify-content: space-between; align-items: center; padding: var(--title-pad, 2px 4px 2px 8px); background: var(--title-bg, #335); color: var(--title-fg, #fff); cursor: move; user-select: none; touch-action: none; }
.win .c { flex: 1; min-height: 0; }
#desktop.drag iframe { pointer-events: none; }
@keyframes win-in { from { opacity: 0; transform: scale(.97); } }
#dock { position: fixed; z-index: 99998; display: flex; gap: var(--dock-gap, 8px); padding: 8px; background: var(--dock-bg, #000a); border-radius: var(--dock-radius, 16px); transition: transform .2s; }
#dock[hidden] { display: none; }
#dock.dock-bottom, #dock.dock-top { left: 0; right: 0; margin: 0 auto; width: max-content; max-width: 96vw; }
#dock.dock-left, #dock.dock-right { top: 0; bottom: 32px; margin: auto 0; height: max-content; flex-direction: column; }
#dock.dock-bottom { bottom: 40px; } #dock.dock-top { top: 8px; } #dock.dock-left { left: 8px; } #dock.dock-right { right: 8px; }
#dock.auto.dock-bottom { transform: translateY(calc(100% + 34px)); }
#dock.auto.dock-top { transform: translateY(calc(-100% - 2px)); }
#dock.auto.dock-left { transform: translateX(calc(-100% - 2px)); }
#dock.auto.dock-right { transform: translateX(calc(100% + 2px)); }
#dock.auto:hover { transform: none; }
.dk { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: var(--dock-icon, 44px); min-height: var(--dock-icon, 44px); background: none; border: 0; border-radius: 10px; color: var(--dock-fg, #fff); font: inherit; font-size: 11px; cursor: pointer; }
.dk svg { font-size: calc(var(--dock-icon, 44px) * .55); }
.dk:hover { background: #fff3; }
.dk.run::after { content: ''; position: absolute; bottom: 2px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
<div id="boot-screen"></div>
<div id="desktop"></div>
<div id="bar"></div>
<script src="sys/icons.js?v=0.3.1"></script>
<script src="sys/boot.js?v=0.3.1"></script>
<script src="sys/backend_local.js?v=0.3.1"></script>
<script src="sys/backend_drive.js?v=0.3.1"></script>
<script src="sys/skeleton.js?v=0.3.1"></script>
<script src="sys/app_loader.js?v=0.3.1"></script>
<script src="firebase-config.js?v=0.3.1"></script>
<script src="sys/kernel.js?v=0.3.1"></script>
<script>TrainOSKernel.boot();</script>
</body>
</html>
