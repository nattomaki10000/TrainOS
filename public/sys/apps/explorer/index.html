<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>エクスプローラー</title>
<style>
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; font-family: var(--font-ui, system-ui, sans-serif); font-size: calc(var(--font-size, 14px) - 1px); user-select: none; }
button { font: inherit; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
input { font: inherit; user-select: text; }
.bar { display: flex; gap: 4px; padding: 4px; border-bottom: 1px solid #8886; }
.bar input { flex: 1; min-width: 0; }
.main { flex: 1; display: flex; min-height: 0; }
#tree { width: 150px; overflow: auto; border-right: 1px solid #8886; padding: 4px; }
#tree div { white-space: nowrap; }
#tree button, .row { border: 0; background: none; color: inherit; }
#tree button { padding: 1px 2px; border-radius: 4px; }
#tree button.cur { background: #4a90e233; }
#list { flex: 1; overflow: auto; padding: 4px; outline: none; }
.row { display: flex; width: 100%; box-sizing: border-box; text-align: left; padding: 3px 6px; border-radius: 4px; }
.row.sel { background: #4a90e255; }
.row.cut { opacity: .5; }
.row .sz { margin-left: auto; opacity: .6; }
.drop { outline: 2px dashed #4a90e2; outline-offset: -2px; background: #4a90e222; }
#list.drop { outline-offset: -4px; }
#msg { padding: 3px 8px; min-height: 1.5em; border-top: 1px solid #8886; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#ctx { position: fixed; z-index: 10; min-width: 170px; padding: 4px; border: 1px solid #8886; border-radius: 6px; background: var(--win-bg, #fff); color: var(--win-fg, #111); box-shadow: 0 4px 16px #0006; }
#ctx button { display: flex; width: 100%; border: 0; background: none; color: inherit; text-align: left; padding: 4px 8px; border-radius: 4px; }
#ctx button:hover:not(:disabled) { background: #4a90e255; }
#ctx button:disabled { opacity: .4; cursor: default; }
#ctx hr { border: 0; border-top: 1px solid #8886; margin: 4px 0; }
</style>
</head>
<body>
<div class="bar">
  <button id="up" title="上へ"></button>
  <input id="path" spellcheck="false">
  <button id="mkd" title="新しいフォルダ"></button>
  <button id="mkf" title="新しいファイル"></button>
  <button id="upl" title="アップロード"></button>
  <button id="dwn" title="ダウンロード"></button>
  <button id="ren" title="名前の変更"></button>
  <button id="del" title="削除"></button>
  <button id="ref" title="更新"></button>
</div>
<div class="main"><div id="tree"></div><div id="list" tabindex="0"></div></div>
<div id="msg"></div>
<div id="ctx" hidden></div>
<input type="file" id="fup" multiple hidden>
<input type="file" id="fdir" webkitdirectory hidden>
<script>
const $ = (id) => document.getElementById(id);
const ic = TrainOS.icon;
const join = (a, b) => (a === '/' ? '' : a) + '/' + b;
const base = (p) => p.split('/').pop();
const dirname = (p) => p.replace(/\/[^/]*$/, '') || '/';
const fmt = (n) => (n == null ? '' : n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB');
const extOf = (n) => { const m = /\.([^./]+)$/.exec(n); return m ? m[1].toLowerCase() : ''; };
const iconFor = (it) => it.isDirectory ? 'folder'
  : /^(png|jpe?g|gif|webp|svg|bmp)$/.test(extOf(it.name)) ? 'file-image'
  : /^(txt|md|log)$/.test(extOf(it.name)) ? 'file-lines' : 'file';
const MIME = 'application/x-trainos-paths';

let cwd = '/', items = [], sel = new Set(), anchor = null, clip = null, dragging = null;

const say = (m) => { $('msg').textContent = m || ''; };
const errMsg = (e) => (e && e.message) || String(e);

// メッセージ欄に入力欄を出す（prompt は使えないため）
const ask = (label, v) => new Promise((ok) => {
  const m = $('msg');
  m.textContent = label + ' ';
  const i = document.createElement('input');
  i.value = v || '';
  m.append(i);
  i.focus();
  i.select();
  i.onkeydown = (e) => {
    if (e.key === 'Enter') { m.textContent = ''; ok(i.value.trim()); }
    else if (e.key === 'Escape') { m.textContent = ''; ok(null); }
    e.stopPropagation();
  };
});

// メッセージ欄に「はい / やめる」を出す
const confirmBar = (label, yes) => new Promise((ok) => {
  const m = $('msg');
  m.textContent = label + ' ';
  const done = (v) => { m.textContent = ''; $('list').focus(); ok(v); };
  const y = document.createElement('button');
  y.textContent = yes;
  y.onclick = () => done(true);
  const n = document.createElement('button');
  n.textContent = 'やめる';
  n.onclick = () => done(false);
  m.onkeydown = (e) => { if (e.key === 'Escape') done(false); };
  m.append(y, n);
  n.focus();
});

const validName = (n) => !!n && !/[\\/]/.test(n) && n !== '.' && n !== '..';

// 同じ名前があれば「名前 (2).拡張子」にする
function uniqueName(name, taken) {
  if (!taken.has(name)) return name;
  const dot = name.lastIndexOf('.');
  const stem = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
  for (let i = 2; ; i++) { const c = stem + ' (' + i + ')' + ext; if (!taken.has(c)) return c; }
}

/* ---------- ツリー（左） ---------- */
async function drawTree() {
  const root = await TrainOS.fs.tree('/');
  const t = $('tree');
  t.replaceChildren();
  (function walk(n, p, d) {
    const row = document.createElement('div');
    row.style.paddingLeft = d * 10 + 'px';
    const b = document.createElement('button');
    b.innerHTML = ic('folder');
    b.append(' ' + (p === '/' ? '/' : n.name));
    b.dataset.path = p;
    if (p === cwd) b.className = 'cur';
    b.onclick = () => load(p);
    b.oncontextmenu = (e) => { e.preventDefault(); menuAt(e, [
      { label: '開く', icon: 'folder-open', fn: () => load(p) },
      { label: '貼り付け', icon: 'paste', fn: () => paste(p), off: !clip },
      { label: 'ダウンロード（zip）', icon: 'download', fn: () => download([p]), off: p === '/' },
    ]); };
    dropTarget(b, () => p);
    row.append(b);
    t.append(row);
    for (const c of n.children || []) if (c.isDirectory) walk(c, join(p, c.name), d + 1);
  })(root, '/', 0);
}

/* ---------- 一覧（右） ---------- */
const open = (it) => (it.isDirectory
  ? load(join(cwd, it.name))
  : TrainOS.app.openFile(join(cwd, it.name)).catch((e) => say(errMsg(e))));

function paint() {
  const cut = new Set(clip && clip.cut ? clip.paths : []);
  for (const r of $('list').children) {
    r.classList.toggle('sel', sel.has(r.dataset.name));
    r.classList.toggle('cut', cut.has(join(cwd, r.dataset.name)));
  }
}

function pick(name, e) {
  const order = items.map((i) => i.name);
  if (e && e.shiftKey && anchor && order.includes(anchor)) {
    const a = order.indexOf(anchor), b = order.indexOf(name);
    sel = new Set(order.slice(Math.min(a, b), Math.max(a, b) + 1));
  } else if (e && (e.ctrlKey || e.metaKey)) {
    if (sel.has(name)) sel.delete(name); else sel.add(name);
    anchor = name;
  } else {
    sel = new Set([name]);
    anchor = name;
  }
  paint();
}

async function load(p) {
  try {
    const list = await TrainOS.fs.list(p);
    cwd = p; sel = new Set(); anchor = null;
    $('path').value = p;
    TrainOS.app.setTitle(p);
    items = list.sort((a, b) => (b.isDirectory - a.isDirectory) || a.name.localeCompare(b.name));
    const l = $('list');
    l.replaceChildren();
    for (const it of items) {
      const r = document.createElement('button');
      r.className = 'row';
      r.dataset.name = it.name;
      r.draggable = true;
      r.innerHTML = ic(iconFor(it));
      const nm = document.createElement('span');
      nm.textContent = ' ' + it.name;
      r.append(nm);
      if (!it.isDirectory) {
        const s = document.createElement('span');
        s.className = 'sz';
        s.textContent = fmt(it.size);
        r.append(s);
      }
      r.onclick = (e) => pick(it.name, e);
      r.ondblclick = () => open(it);
      r.oncontextmenu = (e) => {
        e.preventDefault();
        if (!sel.has(it.name)) pick(it.name);
        menuAt(e, itemMenu());
      };
      r.ondragstart = (e) => {
        if (!sel.has(it.name)) pick(it.name);
        dragging = [...sel].map((n) => join(cwd, n));
        e.dataTransfer.effectAllowed = 'copyMove';
        e.dataTransfer.setData(MIME, JSON.stringify(dragging));
        e.dataTransfer.setData('text/plain', dragging.map(base).join('\n'));
      };
      r.ondragend = () => { dragging = null; clearDrop(); };
      if (it.isDirectory) dropTarget(r, () => join(cwd, it.name));
      l.append(r);
    }
    paint();
    for (const b of $('tree').querySelectorAll('button')) b.classList.toggle('cur', b.dataset.path === cwd);
    say(items.length + ' 件');
  } catch (e) { say(errMsg(e)); }
}

const reload = async () => { await load(cwd); await drawTree(); };

/* ---------- 右クリックメニュー ---------- */
function closeMenu() { $('ctx').hidden = true; }

function menuAt(e, entries) {
  const m = $('ctx');
  m.replaceChildren();
  for (const x of entries) {
    if (x === '-') { m.append(document.createElement('hr')); continue; }
    const b = document.createElement('button');
    b.innerHTML = ic(x.icon || '');
    b.append(' ' + x.label);
    b.disabled = !!x.off;
    b.onclick = () => { closeMenu(); Promise.resolve(x.fn()).catch((err) => say(errMsg(err))); };
    m.append(b);
  }
  m.hidden = false;
  m.style.left = Math.max(0, Math.min(e.clientX, innerWidth - m.offsetWidth - 2)) + 'px';
  m.style.top = Math.max(0, Math.min(e.clientY, innerHeight - m.offsetHeight - 2)) + 'px';
}

const selItems = () => items.filter((i) => sel.has(i.name));

function itemMenu() {
  const one = sel.size === 1 ? selItems()[0] : null;
  return [
    { label: '開く', icon: 'folder-open', fn: () => open(one), off: !one },
    '-',
    { label: 'ダウンロード', icon: 'download', fn: () => download([...sel].map((n) => join(cwd, n))) },
    { label: 'zip に圧縮', icon: 'download', fn: compress },
    { label: 'zip を展開', icon: 'upload', fn: extract, off: !(one && !one.isDirectory && extOf(one.name) === 'zip') },
    { label: 'コピー', icon: 'copy', fn: () => setClip(false) },
    { label: '切り取り', icon: 'scissors', fn: () => setClip(true) },
    { label: '貼り付け（この中に）', icon: 'paste', fn: () => paste(join(cwd, one.name)), off: !(one && one.isDirectory && clip) },
    '-',
    { label: '名前の変更', icon: 'pen', fn: rename, off: !one },
    { label: '削除', icon: 'trash', fn: remove },
  ];
}

function blankMenu() {
  return [
    { label: '新しいフォルダ', icon: 'folder-plus', fn: newFolder },
    { label: '新しいファイル', icon: 'file-circle-plus', fn: newFile },
    '-',
    { label: 'ファイルをアップロード', icon: 'upload', fn: () => $('fup').click() },
    { label: 'フォルダをアップロード', icon: 'upload', fn: () => $('fdir').click() },
    { label: '貼り付け', icon: 'paste', fn: () => paste(cwd), off: !clip },
    '-',
    { label: '更新', icon: 'rotate', fn: reload },
  ];
}

$('list').oncontextmenu = (e) => {
  if (e.target !== $('list')) return;
  e.preventDefault();
  sel = new Set(); paint();
  menuAt(e, blankMenu());
};
document.addEventListener('pointerdown', (e) => { if (!$('ctx').contains(e.target)) closeMenu(); }, true);
window.addEventListener('blur', closeMenu);
$('list').addEventListener('scroll', closeMenu);
$('list').addEventListener('pointerdown', (e) => { if (e.target === $('list') && !e.ctrlKey && !e.shiftKey) { sel = new Set(); paint(); } });

/* ---------- 操作 ---------- */
// 操作して、一覧を読み直す。操作の結果やエラーのメッセージは、読み直しで消さずに残す
async function run(fn) {
  say('');
  let err = null;
  try { await fn(); } catch (e) { err = errMsg(e); }
  const note = err || $('msg').textContent;
  await reload();
  if (note) say(note);
}

const newFolder = () => run(async () => {
  const n = await ask('フォルダ名:');
  if (!n) return;
  if (!validName(n)) throw new Error('使えない名前です');
  await TrainOS.fs.mkdir(join(cwd, n));
});
const newFile = () => run(async () => {
  const n = await ask('ファイル名:');
  if (!n) return;
  if (!validName(n)) throw new Error('使えない名前です');
  await TrainOS.fs.writeFile(join(cwd, n), '');
});
const rename = () => run(async () => {
  if (sel.size !== 1) return say('1つだけ選択してください');
  const old = [...sel][0];
  const n = await ask('新しい名前:', old);
  if (!n || n === old) return;
  if (!validName(n)) throw new Error('使えない名前です');
  await TrainOS.fs.move(join(cwd, old), join(cwd, n));
});
const remove = () => run(async () => {
  if (!sel.size) return say('選択してください');
  const names = [...sel];
  if (!(await confirmBar((names.length === 1 ? names[0] : names.length + ' 件') + ' を削除しますか？', '削除する'))) return;
  for (const n of names) await TrainOS.fs.remove(join(cwd, n));
});

function setClip(cut) {
  if (!sel.size) return say('選択してください');
  clip = { paths: [...sel].map((n) => join(cwd, n)), cut };
  paint();
  say(clip.paths.length + ' 件を' + (cut ? '切り取りました' : 'コピーしました'));
}

// paths を destDir に移動またはコピーする。移動で同じ名前があるときは失敗として数える。コピーは名前を変えて残す
async function transfer(paths, destDir, copy) {
  const taken = new Set((await TrainOS.fs.list(destDir)).map((i) => i.name));
  let ok = 0;
  const errs = [];
  for (const p of paths) {
    try {
      const nm = base(p);
      if (!copy && dirname(p) === destDir) continue;
      if (!copy && taken.has(nm)) throw new Error(nm + ': 同じ名前があります');
      const to = copy ? uniqueName(nm, taken) : nm;
      if (copy) await TrainOS.fs.copy(p, join(destDir, to)); else await TrainOS.fs.move(p, join(destDir, to));
      taken.add(to);
      ok++;
    } catch (e) { errs.push(errMsg(e)); }
  }
  say(ok + ' 件を' + (copy ? 'コピー' : '移動') + 'しました' + (errs.length ? '。失敗: ' + errs.join(' / ') : ''));
}

const paste = (dest) => run(async () => {
  if (!clip) return;
  await transfer(clip.paths, dest, !clip.cut);
  if (clip.cut) clip = null;
});

/* ---------- ドラッグ＆ドロップ ---------- */
function clearDrop() { for (const e of document.querySelectorAll('.drop')) e.classList.remove('drop'); }

const hasFiles = (e) => [...(e.dataTransfer.types || [])].includes('Files');
const hasPaths = (e) => [...(e.dataTransfer.types || [])].includes(MIME);

function dropTarget(el, dest) {
  el.addEventListener('dragover', (e) => {
    if (!hasFiles(e) && !hasPaths(e)) return;
    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect = hasFiles(e) || e.ctrlKey ? 'copy' : 'move';
    clearDrop();
    el.classList.add('drop');
  });
  el.addEventListener('dragleave', () => el.classList.remove('drop'));
  el.addEventListener('drop', (e) => { e.stopPropagation(); onDrop(e, dest()); });
}
dropTarget($('list'), () => cwd);

async function onDrop(e, dest) {
  e.preventDefault();
  clearDrop();
  const copy = e.ctrlKey;
  const raw = hasPaths(e) ? e.dataTransfer.getData(MIME) : '';
  if (raw) { // 別の窓のエクスプローラーから来たものも受け付ける
    let paths = [];
    try { paths = JSON.parse(raw); } catch (x) { return; }
    if (!Array.isArray(paths) || !paths.every((p) => typeof p === 'string' && p.startsWith('/'))) return;
    dragging = null;
    return run(() => transfer(paths, dest, copy));
  }
  if (hasFiles(e)) {
    const entries = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    const files = entries.length ? await entriesToFiles(entries) : [...e.dataTransfer.files].map((f) => ({ rel: f.name, file: f }));
    return run(() => upload(files, dest));
  }
}

// フォルダごとドロップされたものを、{ rel: 'a/b.txt', file } か { rel: 'a/空フォルダ', dir: true } の一覧にする
async function entriesToFiles(entries) {
  const out = [];
  const readAll = (reader) => new Promise((ok, ng) => {
    const all = [];
    const step = () => reader.readEntries((r) => { if (r.length) { all.push(...r); step(); } else ok(all); }, ng);
    step();
  });
  const walk = async (en, prefix) => {
    if (en.isFile) out.push({ rel: prefix + en.name, file: await new Promise((ok, ng) => en.file(ok, ng)) });
    else {
      out.push({ rel: prefix + en.name, dir: true });
      for (const c of await readAll(en.createReader())) await walk(c, prefix + en.name + '/');
    }
  };
  for (const en of entries) await walk(en, '');
  return out;
}

/* ---------- アップロード ---------- */
// files: [{ rel, file | dir }]。一番上の名前は、同じ名前があれば (2) を付けて残す（上書きしない）
async function upload(files, dest) {
  if (!files.length) return;
  const taken = new Set((await TrainOS.fs.list(dest)).map((i) => i.name));
  const top = new Map();
  const target = (rel) => {
    const seg = rel.split('/').filter(Boolean);
    if (!seg.length || seg.some((s) => s === '.' || s === '..')) throw new Error('不正な名前: ' + rel);
    if (!top.has(seg[0])) { const u = uniqueName(seg[0], taken); taken.add(u); top.set(seg[0], u); }
    seg[0] = top.get(seg[0]);
    return join(dest, seg.join('/'));
  };
  // フォルダを先に作る（浅い順）
  const dirs = new Set();
  for (const f of files) {
    const p = target(f.rel);
    if (f.dir) dirs.add(p);
    else for (let d = dirname(p); d !== dest && d !== '/'; d = dirname(d)) dirs.add(d);
  }
  for (const d of [...dirs].sort((a, b) => a.length - b.length)) await TrainOS.fs.mkdir(d);
  const list = files.filter((f) => !f.dir);
  let n = 0;
  const errs = [];
  for (const f of list) {
    say('アップロード中 ' + (n + 1) + ' / ' + list.length + ': ' + f.rel);
    try { await TrainOS.fs.writeFile(target(f.rel), f.file); n++; } catch (e) { errs.push(f.rel + ': ' + errMsg(e)); }
  }
  say(n + ' 件をアップロードしました' + (errs.length ? '。失敗: ' + errs.join(' / ') : ''));
}

$('fup').onchange = () => { const fs = [...$('fup').files].map((f) => ({ rel: f.name, file: f })); $('fup').value = ''; run(() => upload(fs, cwd)); };
$('fdir').onchange = () => {
  const fs = [...$('fdir').files].map((f) => ({ rel: f.webkitRelativePath || f.name, file: f }));
  $('fdir').value = '';
  run(() => upload(fs, cwd));
};

/* ---------- ダウンロード ---------- */
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (u8) => { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };

// deflate（ブラウザ内蔵の CompressionStream）。使えない環境では、圧縮なし（store）にする
const pipe = async (u8, ts) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ts)).arrayBuffer());
async function deflateRaw(u8) { return pipe(u8, new CompressionStream('deflate-raw')); }
async function inflateRaw(u8) { return pipe(u8, new DecompressionStream('deflate-raw')); }

// zip を作る。files: [{ name, data: Uint8Array }]。名前は UTF-8
async function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const canDeflate = typeof CompressionStream === 'function';
  let off = 0;
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data);
    let body = f.data, method = 0;
    if (canDeflate && f.data.length) { const z = await deflateRaw(f.data); if (z.length < f.data.length) { body = z; method = 8; } }
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, method, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
    h.setUint32(18, body.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, nm, body);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, method, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
    c.setUint32(20, body.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, nm.length, true);
    c.setUint32(42, off, true);
    central.push(c.buffer, nm);
    off += 30 + nm.length + body.length;
  }
  const csize = central.reduce((s, b) => s + b.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, e.buffer], { type: 'application/zip' });
}

// zip の目次（中央ディレクトリ）を読む。ZIP64 は未対応
function zipEntries(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 22 - 65535); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('zip として読めません');
  const n = dv.getUint16(e + 10, true), cdOff = dv.getUint32(e + 16, true);
  if (n === 0xffff || cdOff === 0xffffffff) throw new Error('ZIP64 の zip には未対応です');
  const out = [];
  let p = cdOff;
  for (let i = 0; i < n; i++) {
    if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) throw new Error('zip が壊れています');
    const flags = dv.getUint16(p + 8, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    // 名前が UTF-8 でない古い zip は、日本語環境の Shift_JIS として読む
    const name = new TextDecoder(flags & 0x800 ? 'utf-8' : 'shift_jis').decode(u8.subarray(p + 46, p + 46 + nl));
    out.push({ name, flags, method: dv.getUint16(p + 10, true), crc: dv.getUint32(p + 16, true), cs: dv.getUint32(p + 20, true), us: dv.getUint32(p + 24, true), off: dv.getUint32(p + 42, true) });
    p += 46 + nl + xl + cl;
  }
  return out;
}

// paths（ファイルとフォルダ）の中のファイルを、zip 用の { name, data } の一覧にする
async function gather(paths) {
  const out = [];
  const walk = async (p, prefix) => {
    const n = await TrainOS.fs.tree(p);
    if (n.isDirectory) for (const c of n.children || []) await walk(join(p, c.name), prefix + base(p) + '/');
    else out.push({ name: prefix + base(p), data: new Uint8Array(await (await TrainOS.fs.readFile(p)).arrayBuffer()) });
  };
  for (const p of paths) await walk(p, '');
  return out;
}

async function download(paths) {
  try {
    if (!paths.length) return say('選択してください');
    const nodes = await Promise.all(paths.map((p) => TrainOS.fs.tree(p)));
    if (paths.length === 1 && !nodes[0].isDirectory) {
      say('ダウンロード中: ' + base(paths[0]));
      await TrainOS.fs.download(base(paths[0]), await TrainOS.fs.readFile(paths[0]));
      return say('ダウンロードしました: ' + base(paths[0]));
    }
    say('zip を作っています…');
    const out = await gather(paths);
    if (!out.length) return say('ファイルがありません（空のフォルダは zip に入りません）');
    const nm = paths.length === 1 ? base(paths[0]) : 'files';
    await TrainOS.fs.download(nm + '.zip', await makeZip(out));
    say(out.length + ' 件を ' + nm + '.zip でダウンロードしました');
  } catch (e) { say(errMsg(e)); }
}

/* ---------- zip の圧縮と展開 ---------- */
// 選択したものを、このフォルダの zip にする（同じ名前があれば (2) を付ける）
const compress = () => run(async () => {
  const paths = [...sel].map((n) => join(cwd, n));
  if (!paths.length) return say('選択してください');
  say('圧縮しています…');
  const out = await gather(paths);
  if (!out.length) throw new Error('ファイルがありません（空のフォルダは zip に入りません）');
  const taken = new Set((await TrainOS.fs.list(cwd)).map((i) => i.name));
  const nm = uniqueName((paths.length === 1 ? base(paths[0]) : 'files') + '.zip', taken);
  await TrainOS.fs.writeFile(join(cwd, nm), await makeZip(out));
  say(out.length + ' 件を ' + nm + ' に圧縮しました');
});

const MAX_UNZIP = 1024 * 1024 * 1024; // 展開後の合計の上限（zip 爆弾よけ）

// zip を、同じ場所の「zip の名前のフォルダ」に展開する。壊れた項目や危険な名前は飛ばして、数を知らせる
const extract = () => run(async () => {
  const one = selItems()[0];
  if (sel.size !== 1 || !one || one.isDirectory || extOf(one.name) !== 'zip') throw new Error('zip ファイルを1つ選択してください');
  const path = join(cwd, one.name);
  say('展開しています…');
  const u8 = new Uint8Array(await (await TrainOS.fs.readFile(path)).arrayBuffer());
  const ents = zipEntries(u8);
  if (ents.reduce((s, x) => s + x.us, 0) > MAX_UNZIP) throw new Error('展開後が大きすぎます（1GB まで）');
  const taken = new Set((await TrainOS.fs.list(cwd)).map((i) => i.name));
  const split = (n) => n.replace(/\\/g, '/').split('/').filter((x) => x && x !== '.');
  // 中身が1つのフォルダだけなら、そのフォルダをここに展開する（zip の名前のフォルダで二重にしない）
  const tops = new Set(ents.map((x) => split(x.name)[0]).filter(Boolean));
  const single = tops.size === 1 && ents.some((x) => /[\\/]$/.test(x.name) || split(x.name).length > 1) && ![...tops][0].includes(':');
  const top = single ? uniqueName([...tops][0], taken) : null;
  const root = single ? join(cwd, top) : join(cwd, uniqueName(one.name.replace(/\.zip$/i, '') || 'zip', taken));
  await TrainOS.fs.mkdir(root);
  const made = new Set([root]);
  const ensure = async (dir) => { // root の下の入れ子のフォルダを、浅い方から作る
    const chain = [];
    for (let d = dir; !made.has(d); d = dirname(d)) chain.unshift(d);
    for (const d of chain) { await TrainOS.fs.mkdir(d); made.add(d); }
  };
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let ok = 0, skipped = 0;
  const why = [];
  for (const en of ents) {
    const isDir = /[\\/]$/.test(en.name);
    const segs = split(en.name);
    try {
      if (!segs.length) continue;
      if (single) segs.shift();
      if (!segs.length) continue;
      if (segs.includes('..') || /^[A-Za-z]:$/.test(segs[0])) throw new Error('危険な名前');
      const dest = join(root, segs.join('/'));
      if (isDir) { await ensure(dest); continue; }
      if (en.flags & 1) throw new Error('暗号化されています');
      if (en.method !== 0 && en.method !== 8) throw new Error('未対応の圧縮方式');
      if (en.off + 30 > u8.length || dv.getUint32(en.off, true) !== 0x04034b50) throw new Error('壊れています');
      const start = en.off + 30 + dv.getUint16(en.off + 26, true) + dv.getUint16(en.off + 28, true);
      const raw = u8.subarray(start, start + en.cs);
      const data = en.method === 0 ? raw : await inflateRaw(raw);
      if (data.length !== en.us || crc32(data) !== en.crc) throw new Error('壊れています（CRC が合いません）');
      await ensure(dirname(dest));
      await TrainOS.fs.writeFile(dest, new Blob([data]));
      ok++;
    } catch (e) { skipped++; if (why.length < 3) why.push(en.name + ': ' + errMsg(e)); }
  }
  say(ok + ' 件を ' + base(root) + ' に展開しました' + (skipped ? '。飛ばした項目 ' + skipped + ' 件（' + why.join(' / ') + '）' : ''));
});

/* ---------- ボタン・キー ---------- */
$('mkd').onclick = newFolder;
$('mkf').onclick = newFile;
$('upl').onclick = () => $('fup').click();
$('dwn').onclick = () => download([...sel].map((n) => join(cwd, n)));
$('ren').onclick = rename;
$('del').onclick = remove;
$('ref').onclick = () => run(async () => {});
$('up').onclick = () => load(dirname(cwd));
$('path').onkeydown = (e) => { if (e.key === 'Enter') load($('path').value.trim() || '/'); };

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMenu();
  if (e.target.tagName === 'INPUT' || e.target.closest('#msg')) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  const move = (d) => {
    const names = items.map((i) => i.name);
    if (!names.length) return;
    const cur = names.indexOf(anchor);
    const next = names[Math.max(0, Math.min(names.length - 1, cur < 0 ? (d > 0 ? 0 : names.length - 1) : cur + d))];
    pick(next, { shiftKey: e.shiftKey });
    const r = [...$('list').children].find((c) => c.dataset.name === next);
    if (r) r.scrollIntoView({ block: 'nearest' });
  };
  if (mod && k === 'a') { sel = new Set(items.map((i) => i.name)); paint(); }
  else if (mod && k === 'c') setClip(false);
  else if (mod && k === 'x') setClip(true);
  else if (mod && k === 'v') paste(cwd);
  else if (e.key === 'Delete') remove();
  else if (e.key === 'F2') rename();
  else if (e.key === 'Enter' && sel.size === 1) open(selItems()[0]);
  else if (e.key === 'Backspace') load(dirname(cwd));
  else if (e.key === 'ArrowDown') move(1);
  else if (e.key === 'ArrowUp') move(-1);
  else return;
  e.preventDefault();
});

for (const [id, name] of [['up', 'arrow-up'], ['mkd', 'folder-plus'], ['mkf', 'file-circle-plus'], ['upl', 'upload'], ['dwn', 'download'], ['ren', 'pen'], ['del', 'trash'], ['ref', 'rotate']]) {
  $(id).innerHTML = ic(name);
}

let opened = false;
TrainOS.app.onOpen((p) => { opened = true; load(p); });
drawTree();
setTimeout(() => { if (!opened) load('/usr'); }, 100);
</script>
