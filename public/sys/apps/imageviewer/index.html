<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>画像ビューア</title>
<style>
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; font-family: var(--font-ui, system-ui, sans-serif); font-size: calc(var(--font-size, 14px) - 1px); user-select: none; }
button { font: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; min-width: 2em; }
button:disabled { opacity: .4; cursor: default; }
input { font: inherit; user-select: text; }
.bar { display: flex; gap: 4px; padding: 4px; border-bottom: 1px solid #8886; align-items: center; }
.bar input { flex: 1; min-width: 0; }
#stage { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none; outline: none;
  background: #8883 repeating-conic-gradient(#8882 0% 25%, transparent 0% 50%) 0 0 / 16px 16px; }
#stage.drag { cursor: grabbing; }
#img { position: absolute; left: 50%; top: 50%; max-width: none; transform-origin: center; image-rendering: auto; }
#img.px { image-rendering: pixelated; }
#note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; opacity: .7; pointer-events: none; }
#note[hidden], #img[hidden] { display: none; }
#st { padding: 3px 8px; min-height: 1.5em; border-top: 1px solid #8886; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="bar">
  <button id="prev" title="前の画像（←）"></button>
  <button id="next" title="次の画像（→）"></button>
  <input id="path" spellcheck="false" placeholder="/usr/documents/photo.png">
  <button id="zo" title="縮小（-）"></button>
  <button id="zi" title="拡大（+）"></button>
  <button id="fit" title="ウィンドウに合わせる（0）"></button>
  <button id="one" title="実際のサイズ（1）">100%</button>
  <button id="rl" title="左に回転（Shift+R）"></button>
  <button id="rr" title="右に回転（R）"></button>
</div>
<div id="stage" tabindex="0"><img id="img" alt="" hidden><div id="note">エクスプローラーで画像を開くか、上の欄にパスを入力してください</div></div>
<div id="st"></div>
<script>
const $ = (id) => document.getElementById(id);
const ic = TrainOS.icon;
const stage = $('stage'), img = $('img');
const MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp' };
const extOf = (n) => { const m = /\.([^./]+)$/.exec(n); return m ? m[1].toLowerCase() : ''; };
const base = (p) => p.split('/').pop();
const dirname = (p) => p.replace(/\/[^/]*$/, '') || '/';

let path = null, files = [], idx = -1, url = null;
let s = 1, tx = 0, ty = 0, rot = 0, fitMode = true, seq = 0;

const say = (m) => { $('st').textContent = m || ''; };
const MIN = 0.02, MAX = 40;

function apply() {
  img.style.transform = 'translate(-50%,-50%) translate(' + tx + 'px,' + ty + 'px) rotate(' + rot + 'deg) scale(' + s + ')';
  img.classList.toggle('px', s >= 3);
  info();
}

function info(extra) {
  if (!path) return;
  const parts = [base(path), img.naturalWidth + ' × ' + img.naturalHeight, Math.round(s * 100) + '%'];
  if (files.length > 1) parts.push((idx + 1) + ' / ' + files.length);
  say(extra || parts.join('   '));
}

// 回転も考えて、ウィンドウに収まる倍率にする（拡大はしない）
function fitScale() {
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return 1;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const swap = rot % 180 !== 0;
  const iw = swap ? h : w, ih = swap ? w : h;
  return Math.min(1, sw / iw, sh / ih);
}

function fit() { fitMode = true; s = fitScale(); tx = ty = 0; apply(); }
function actual() { fitMode = false; s = 1; tx = ty = 0; apply(); }

// 画面上の点 (cx, cy)（ステージの中心からの距離）を動かさずに、倍率を変える
function zoomTo(ns, cx, cy) {
  ns = Math.min(MAX, Math.max(MIN, ns));
  tx = cx - (cx - tx) * (ns / s);
  ty = cy - (cy - ty) * (ns / s);
  s = ns;
  fitMode = false;
  apply();
}
const zoomBy = (f) => zoomTo(s * f, 0, 0);

function rotate(d) { rot = (rot + d + 360) % 360; if (fitMode) fit(); else apply(); }

async function show(p) {
  const my = ++seq;
  say('読み込み中…');
  try {
    const blob = await TrainOS.fs.readFile(p);
    if (my !== seq) return;
    const typed = new Blob([blob], { type: MIME[extOf(p)] || blob.type || 'application/octet-stream' });
    const u = URL.createObjectURL(typed);
    await new Promise((ok, ng) => { img.onload = ok; img.onerror = () => ng(new Error('画像として読み込めません: ' + p)); img.src = u; });
    if (my !== seq) { URL.revokeObjectURL(u); return; }
    if (url) URL.revokeObjectURL(url);
    url = u;
    path = p;
    rot = 0;
    $('path').value = p;
    img.hidden = false;
    $('note').hidden = true;
    TrainOS.app.setTitle(base(p) + ' - 画像ビューア');
    fit();
  } catch (e) {
    if (my === seq) say((e && e.message) || String(e));
  }
}

// 同じフォルダの画像の一覧（← → で切り替える）
async function scanDir(p) {
  try {
    const list = await TrainOS.fs.list(dirname(p));
    files = list.filter((i) => !i.isDirectory && MIME[extOf(i.name)]).map((i) => i.name).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    idx = files.indexOf(base(p));
  } catch (e) { files = []; idx = -1; }
  $('prev').disabled = $('next').disabled = files.length < 2;
}

async function openPath(p) {
  p = String(p || '').trim();
  if (!p) return;
  await show(p);
  if (path === p) { await scanDir(p); info(); }
}

function step(d) {
  if (files.length < 2) return;
  idx = (idx + d + files.length) % files.length;
  const dir = dirname(path);
  show((dir === '/' ? '' : dir) + '/' + files[idx]).then(() => info());
}

/* ---------- 操作 ---------- */
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('zo').onclick = () => zoomBy(1 / 1.25);
$('zi').onclick = () => zoomBy(1.25);
$('fit').onclick = fit;
$('one').onclick = actual;
$('rl').onclick = () => rotate(-90);
$('rr').onclick = () => rotate(90);
$('path').onkeydown = (e) => { if (e.key === 'Enter') openPath($('path').value); e.stopPropagation(); };

stage.addEventListener('wheel', (e) => {
  if (!path) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomTo(s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2);
}, { passive: false });

let drag = null;
stage.addEventListener('pointerdown', (e) => {
  stage.focus();
  if (!path || e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, tx, ty };
  stage.setPointerCapture(e.pointerId);
  stage.classList.add('drag');
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  tx = drag.tx + e.clientX - drag.x;
  ty = drag.ty + e.clientY - drag.y;
  apply();
});
const endDrag = () => { drag = null; stage.classList.remove('drag'); };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('dblclick', () => { if (path) (fitMode && s < 1 ? actual : fit)(); });

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowLeft') step(-1);
  else if (k === 'ArrowRight') step(1);
  else if (k === '+' || k === '=') zoomBy(1.25);
  else if (k === '-') zoomBy(1 / 1.25);
  else if (k === '0') fit();
  else if (k === '1') actual();
  else if (k === 'r') rotate(90);
  else if (k === 'R') rotate(-90);
  else return;
  e.preventDefault();
});

new ResizeObserver(() => { if (path && fitMode) fit(); }).observe(stage);

for (const [id, name] of [['prev', 'arrow-left'], ['next', 'arrow-right'], ['zo', 'minus'], ['zi', 'plus'], ['fit', 'expand'], ['rl', 'rotate-left'], ['rr', 'rotate-right']]) {
  $(id).innerHTML = ic(name);
}
$('prev').disabled = $('next').disabled = true;
TrainOS.app.setTitle('画像ビューア');
TrainOS.app.onOpen(openPath);
</script>
</body>
</html>
