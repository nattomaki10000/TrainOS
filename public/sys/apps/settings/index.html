<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<style>
body { font-family: var(--font-ui, system-ui, sans-serif); font-size: var(--font-size, 14px); margin: 0; padding: 12px; display: grid; gap: 12px; align-content: start; }
fieldset { border: 1px solid #8886; border-radius: 6px; display: grid; gap: 8px; }
label { display: flex; gap: 8px; align-items: center; }
label > select { flex: 1; min-width: 0; }
input, select, button { font: inherit; }
.note { font-size: calc(var(--font-size, 14px) - 2px); opacity: .7; }
.krow { display: flex; gap: 6px; align-items: center; }
.krow .kc { min-width: 9em; font-family: var(--font-mono, ui-monospace, monospace); }
.krow select { flex: 1; min-width: 0; }
button { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
#st { opacity: .7; min-height: 1.2em; }
</style>
</head>
<body>
<fieldset><legend>デスクトップ環境</legend>
  <label><select id="desktopEnv"></select></label>
  <div class="note">選ぶと、ウィンドウマネージャー、テーマ、カーソル、壁紙、アニメーション、パネルなどがまとめて切り替わります。そのあと、下の項目を個別に変えられます。</div>
</fieldset>
<fieldset><legend>ウィンドウ</legend>
  <label>ウィンドウマネージャー <select id="windowManager"></select></label>
  <label>ウィンドウテーマ <select id="windowTheme"></select></label>
  <label>アニメーション <select id="animation"></select></label>
</fieldset>
<fieldset><legend>シェル</legend>
  <label>シェルテーマ <select id="shellTheme"></select></label>
  <label>パネル（ドック・タスクバー） <select id="panel"></select></label>
  <label>アイコンセット <select id="iconset"></select></label>
  <label>マウスカーソル <select id="cursor"></select></label>
</fieldset>
<fieldset><legend>壁紙</legend>
  <label><select id="wp"></select></label>
  <label>色・パス <input id="wpc" size="22" placeholder="#245 や /usr/documents/bg.png"><button id="wpb">適用</button></label>
</fieldset>
<fieldset><legend>フォント</legend>
  <label>フォント <select id="fontf"></select></label>
  <label>システムのフォント名 <input id="fonts" size="14" placeholder="例: Noto Sans JP"></label>
  <label>文字の大きさ <input id="fsize" type="number" min="9" max="32" style="width:4em"> <button id="fontb">フォントを適用</button></label>
</fieldset>
<fieldset><legend>キー割り当て</legend>
  <label><select id="keymap"></select></label>
  <div id="keys"></div>
  <label><button id="keyadd"></button></label>
  <div class="note">キーの欄を押してから、割り当てたいキーを押します（Alt か Meta を含む組み合わせだけ使えます。Esc でやめる）。変更すると sys/keymaps/custom.json に保存され、その割り当てに切り替わります。元に戻すには、上の一覧から別の割り当てを選びます。</div>
</fieldset>
<fieldset><legend>起動画面</legend>
  <label><select id="bootLoader"></select></label>
</fieldset>
<fieldset><legend>components（次回の起動から有効）</legend><div id="comp"></div></fieldset>
<fieldset id="sync" hidden><legend>Google Drive</legend>
  <label>自動保存の間隔 <input id="min" type="number" min="1" max="120" style="width:5em"> 分</label>
</fieldset>
<fieldset><legend>標準ファイル</legend>
  <label><button id="rst">標準ファイルを復元・更新</button></label>
</fieldset>
<fieldset><legend>情報</legend><div id="info"></div></fieldset>
<div id="st"></div>
<script>
const $ = (id) => document.getElementById(id);
const say = (m) => { $('st').textContent = m; };
const legacy = (s, k, d) => (s[k] !== undefined ? s[k] : d);
const fill = (sel, items, cur, none) => {
  sel.replaceChildren();
  sel.add(new Option(none, ''));
  for (const n of items) sel.add(new Option(n, n));
  sel.value = cur || '';
};
const isFile = (w) => /^[\w-]+\.\w+$/.test(w || '');

// [項目の id（= 設定のキー）, info の一覧, 「なし」の表示, 設定が未指定のときの値]
const SEL = [
  ['desktopEnv', 'desktops', '（個別に設定）', () => ''],
  ['windowManager', 'windowManagers', '内蔵（最小）', () => 'floating'],
  ['windowTheme', 'windowThemes', '内蔵', (s) => legacy(s, 'theme', 'light')],
  ['animation', 'animations', 'なし', () => ''],
  ['shellTheme', 'shellThemes', '内蔵', (s) => legacy(s, 'theme', 'light')],
  ['panel', 'panels', 'なし', (s) => legacy(s, 'dock', 'bottom')],
  ['iconset', 'iconsets', '標準', () => ''],
  ['cursor', 'cursors', '標準', () => ''],
  ['keymap', 'keymaps', 'なし', () => 'default'],
  ['bootLoader', 'bootLoaders', '内蔵（シンプル）', () => ''],
];

/* ---------- ショートカットの編集 ---------- */
const ACT_LABEL = { closeWindow: 'ウィンドウを閉じる', maximize: '最大化 / 元に戻す', minimize: '最小化', launcher: 'アプリの一覧を開く', nextWindow: '次のウィンドウ', prevWindow: '前のウィンドウ', toMaster: 'メインのウィンドウにする' };
const enc = (a) => (typeof a === 'string' ? 'act:' + a : a && a.launch ? 'launch:' + a.launch : a && a.open ? 'open:' + a.open : '');
const dec = (v) => (v.startsWith('act:') ? v.slice(4) : v.startsWith('launch:') ? { launch: v.slice(7) } : { open: v.slice(5) });
let curKeys = {}, curInfo = null;

// カーネルの keyCombo と同じ決め方で、キーの組み合わせを文字列にする
const keyCombo = (e) => {
  const k = /^Key[A-Z]$/.test(e.code || '') ? e.code.slice(3)
    : /^Digit\d$/.test(e.code || '') ? e.code.slice(5)
    : e.code === 'Space' ? 'Space' : e.code === 'Comma' ? ',' : e.code === 'Period' ? '.'
    : (e.key || '').length === 1 ? e.key.toUpperCase() : (e.key || '');
  if (!k || ['Control', 'Alt', 'Shift', 'Meta'].includes(k)) return '';
  return [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Meta', k].filter(Boolean).join('+');
};

// 次に押されたキーの組み合わせを返す（Esc は null）。OS のキー割り当てが動かないよう、キーはここで止める
const capture = () => new Promise((ok) => {
  say('割り当てるキーを押してください（Esc でやめる）');
  const h = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (e.key === 'Escape') { window.removeEventListener('keydown', h, true); say(''); return ok(null); }
    const c = keyCombo(e);
    if (!c) return;
    if (!e.altKey && !e.metaKey) return say('Alt か Meta（Win / Cmd）を押しながら押してください（Esc でやめる）');
    window.removeEventListener('keydown', h, true);
    say('');
    ok(c);
  };
  window.addEventListener('keydown', h, true);
});

const saveKeys = async (map) => {
  try {
    await TrainOS.sys.saveKeymap('custom', map);
    say('保存しました（sys/keymaps/custom.json）');
    await render();
  } catch (e) { say('失敗: ' + e.message); }
};

// 順番を保ったまま、キーを入れ替える / 操作を変える / 消す
const mapWith = (old, combo, action) => {
  const m = {};
  for (const [k, v] of Object.entries(curKeys)) {
    if (k !== old) m[k] = v;
    else if (action !== null) m[combo] = action;
  }
  return m;
};

function renderKeys(info) {
  curInfo = info;
  curKeys = Object.assign({}, info.keys || {});
  const box = $('keys');
  box.replaceChildren();
  for (const [combo, a] of Object.entries(curKeys)) {
    const row = document.createElement('div');
    row.className = 'krow';
    const kb = document.createElement('button');
    kb.className = 'kc';
    kb.textContent = combo;
    kb.title = '押してから、新しいキーを押す';
    kb.onclick = async () => {
      const c = await capture();
      if (!c || c === combo) return;
      if (Object.prototype.hasOwnProperty.call(curKeys, c)) return say(c + ' には、すでに割り当てがあります');
      saveKeys(mapWith(combo, c, a));
    };
    const sel = document.createElement('select');
    const cur = enc(a);
    const opts = [];
    for (const n of info.actions) opts.push(['act:' + n, ACT_LABEL[n] || n]);
    for (const x of info.apps) opts.push(['launch:' + x.id, x.name + ' を起動']);
    if (!opts.some((o) => o[0] === cur)) opts.push([cur, a && a.open ? 'ファイルを開く: ' + a.open : cur.replace(/^act:/, '')]);
    for (const [v, t] of opts) sel.add(new Option(t, v));
    sel.value = cur;
    sel.onchange = () => saveKeys(mapWith(combo, combo, sel.value === cur ? a : dec(sel.value)));
    const del = document.createElement('button');
    del.innerHTML = TrainOS.icon('trash');
    del.title = 'この割り当てを消す';
    del.onclick = () => saveKeys(mapWith(combo, combo, null));
    row.append(kb, sel, del);
    box.append(row);
  }
  if (!Object.keys(curKeys).length) box.textContent = '（割り当てなし）';
}

$('keyadd').innerHTML = TrainOS.icon('plus') + ' ショートカットを追加';
$('keyadd').onclick = async () => {
  if (!curInfo || !curInfo.apps.length) return;
  const c = await capture();
  if (!c) return;
  if (Object.prototype.hasOwnProperty.call(curKeys, c)) return say(c + ' には、すでに割り当てがあります');
  saveKeys(Object.assign({}, curKeys, { [c]: { launch: curInfo.apps[0].id } }));
};

const set = async (p) => {
  try { await TrainOS.sys.setSettings(p); say('保存しました'); }
  catch (e) { say('失敗: ' + e.message); }
};

$('rst').onclick = async () => {
  try {
    const r = await TrainOS.sys.restoreDefaults(true);
    say(r.copied.length + ' 件コピー、' + r.updated.length + ' 件更新' + (r.conflicts.length ? '、編集済みのため .new を作成: ' + r.conflicts.join(', ') : ''));
  } catch (e) { say('失敗: ' + e.message); }
};

async function render() {
  const { settings: s, info } = await TrainOS.sys.getSettings();

  for (const [id, list, none, def] of SEL) fill($(id), info[list], s[id] !== undefined ? s[id] : def(s), none);
  fill($('wp'), info.wallpapers, isFile(s.wallpaper) ? s.wallpaper : '', 'なし（色）');
  $('wpc').value = isFile(s.wallpaper) ? '' : (s.wallpaper || '');

  const f = s.font || {};
  const fFile = /\.(woff2?|ttf|otf)$/i.test(f.ui || '');
  fill($('fontf'), info.fonts, fFile ? f.ui : '', '標準');
  $('fonts').value = fFile ? '' : (f.ui || '');
  $('fsize').value = f.size || 14;

  const off = new Set(s.disabledComponents || []);
  $('comp').replaceChildren();
  for (const name of info.components) {
    const l = document.createElement('label');
    const c = document.createElement('input');
    c.type = 'checkbox';
    c.checked = !off.has(name);
    c.onchange = () => { c.checked ? off.delete(name) : off.add(name); set({ disabledComponents: [...off] }); };
    l.append(c, name);
    $('comp').append(l);
  }
  if (!info.components.length) $('comp').textContent = '（なし）';

  renderKeys(info);

  if (info.backend === 'drive') { $('sync').hidden = false; $('min').value = s.syncMinutes || 10; }
  $('info').textContent = 'TrainOS ' + info.version + ' / 保存先: ' +
    (info.backend === 'drive' ? 'Google Drive' + (info.user ? '（' + info.user + '）' : '') : 'ローカルフォルダ') +
    (info.safe ? ' / セーフモード（カスタマイズは使われません）' : '');
  return f;
}

(async () => {
  TrainOS.app.setTitle('設定');
  let f = await render();
  for (const [id] of SEL) {
    $(id).onchange = async () => { await set({ [id]: $(id).value || null }); if (id === 'desktopEnv' || id === 'keymap') f = await render(); };
  }
  $('wp').onchange = () => set({ wallpaper: $('wp').value || null });
  $('wpb').onclick = () => set({ wallpaper: $('wpc').value.trim() || null });
  $('fontb').onclick = () => set({ font: { ui: $('fontf').value || $('fonts').value.trim(), mono: f.mono || '', size: Math.min(32, Math.max(9, +$('fsize').value || 14)) } });
  $('min').onchange = () => set({ syncMinutes: Math.max(1, +$('min').value || 10) });
})().catch((e) => say('読み込み失敗: ' + e.message));
</script>
</body>
</html>
